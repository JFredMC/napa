name: Deploy demo to GitHub Pages

# Publica la web de Ñapa en GitHub Pages (https://napaofertas.com/ por defecto, o el dominio de NAPA_SITE_URL).
# Afiliados, anuncios, analítica y canales salen de variables del repositorio (Settings → Variables → Actions);
# sin ellas, todo queda apagado.
# Cada mañana se vuelve a publicar con una foto nueva de precios reales (páginas prerenderizadas).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *' # 6:00 a. m. en Colombia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @napa/deals-engine build
      - run: pnpm --filter @napa/connectors build
      - uses: actions/configure-pages@v5
      - name: Foto de precios reales (si Render no responde, se usa la del repositorio)
        run: node apps/web/scripts/snapshot.mjs
        env:
          NAPA_API_URL: ${{ vars.NAPA_API_URL }}
      - name: Build (base href según NAPA_SITE_URL)
        run: pnpm --filter @napa/web build:pages
        env:
          NAPA_SITE_URL: ${{ vars.NAPA_SITE_URL }}
          NAPA_API_URL: ${{ vars.NAPA_API_URL }}
          NAPA_AFF_MERCADOLIBRE: ${{ vars.NAPA_AFF_MERCADOLIBRE }}
          NAPA_AFF_FALABELLA: ${{ vars.NAPA_AFF_FALABELLA }}
          NAPA_AFF_SHEIN: ${{ vars.NAPA_AFF_SHEIN }}
          NAPA_AFF_TEMU: ${{ vars.NAPA_AFF_TEMU }}
          NAPA_GOOGLE_SITE_VERIFICATION: ${{ vars.NAPA_GOOGLE_SITE_VERIFICATION }}
          NAPA_GOOGLE_VERIFICATION_FILE: ${{ vars.NAPA_GOOGLE_VERIFICATION_FILE }}
          NAPA_AFF_TEMU_URL: ${{ vars.NAPA_AFF_TEMU_URL }}
          NAPA_AFF_TEMU_CODE: ${{ vars.NAPA_AFF_TEMU_CODE }}
          NAPA_AFF_ALKOSTO: ${{ vars.NAPA_AFF_ALKOSTO }}
          NAPA_AFF_EXITO: ${{ vars.NAPA_AFF_EXITO }}
          NAPA_AFF_CARULLA: ${{ vars.NAPA_AFF_CARULLA }}
          NAPA_AFF_JUMBO: ${{ vars.NAPA_AFF_JUMBO }}
          NAPA_AFF_OLIMPICA: ${{ vars.NAPA_AFF_OLIMPICA }}
          NAPA_ADSENSE_CLIENT: ${{ vars.NAPA_ADSENSE_CLIENT }}
          NAPA_ADSENSE_SLOT_FEED: ${{ vars.NAPA_ADSENSE_SLOT_FEED }}
          NAPA_ADSENSE_SLOT_PRODUCT: ${{ vars.NAPA_ADSENSE_SLOT_PRODUCT }}
          NAPA_GOATCOUNTER: ${{ vars.NAPA_GOATCOUNTER }}
          NAPA_CF_BEACON_TOKEN: ${{ vars.NAPA_CF_BEACON_TOKEN }}
          NAPA_CONTACT_EMAIL: ${{ vars.NAPA_CONTACT_EMAIL }}
          NAPA_LEGAL_OWNER: ${{ vars.NAPA_LEGAL_OWNER }}
          NAPA_TELEGRAM_URL: ${{ vars.NAPA_TELEGRAM_URL }}
          NAPA_TELEGRAM_BOT_URL: ${{ vars.NAPA_TELEGRAM_BOT_URL }}
          NAPA_WHATSAPP_URL: ${{ vars.NAPA_WHATSAPP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
