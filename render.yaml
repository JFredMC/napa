# Blueprint de Render para el backend de Ñapa (plan gratuito).
# En Render: New → Blueprint → repositorio JFredMC/napa, rama main. Pide los valores marcados
# con `sync: false` (credenciales de Mercado Libre); si se dejan vacíos, Mercado Libre queda simulado.
services:
  - type: web
    name: napa-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Despliega solo cuando el CI de main pasa.
    autoDeployTrigger: checksPass
    # Se instala desde la raíz del monorepo (lockfile y paquetes compartidos) y solo se construye la API.
    buildCommand: >-
      pnpm install --frozen-lockfile --prod=false --filter @napa/api... &&
      pnpm --filter @napa/deals-engine build &&
      pnpm --filter @napa/connectors build &&
      pnpm --filter @napa/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - pnpm-lock.yaml
        - package.json
        - render.yaml
      ignoredPaths:
        - apps/api/test/**
        - '**/*.spec.ts'
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: CORS_ORIGINS
        value: https://napaofertas.com,https://www.napaofertas.com,https://jfredmc.github.io,https://cuadrelaboral.com,https://www.cuadrelaboral.com
      # Éxito y Carulla siguen en la lista para que /api/sources explique por qué están bloqueadas
      # (robots.txt + protección anti-bots); el backend nunca consulta su /api/.
      - key: LIVE_STORES
        value: jumbo,olimpica,exito,carulla
      - key: USER_AGENT
        value: NapaBot/0.1 (+https://github.com/JFredMC/napa)
      - key: CACHE_TTL_MS
        value: '3600000'
      - key: UPSTREAM_INTERVAL_MS
        value: '2000'
      - key: CLIENT_RPM
        value: '60'
      - key: SITE_URL
        value: https://napaofertas.com/
      # Protege /api/clicks y /api/channel/* (mín. 24 caracteres). Render lo genera.
      - key: ADMIN_TOKEN
        generateValue: true
      # Canal de Telegram (opcional): token de @BotFather y @canal o -100…; el bot debe ser admin.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      # Alertas de precio (@NapaOfertasBot): estado cifrado en un gist secreto. Token clásico de
      # GitHub con SOLO el permiso `gist`. Sin estos dos valores, las alertas viven en memoria.
      - key: ALERTS_GIST_ID
        sync: false
      - key: ALERTS_GITHUB_TOKEN
        sync: false
      # Referido de Temu (público): línea al final del post del canal.
      - key: NAPA_AFF_TEMU_URL
        value: https://temu.to/k/gxqocgbt517
      - key: NAPA_AFF_TEMU_CODE
        value: aln328979
      - key: CHANNEL_TOP_N
        value: '5'
      # Firma de integridad del Web Checkout de Wompi (aportes del portafolio). Secreto.
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      # Eventos de Wompi (checksum de /api/wompi/events) para las plantillas de Cuadre. Secreto.
      - key: WOMPI_EVENTS_SECRET
        sync: false
      # Plantillas completas de Cuadre: gist secreto con los .xlsx cifrados (AES-256-GCM) y su clave.
      # El repo es público: los archivos nunca se suben aquí.
      - key: CUADRE_FILES_GIST_ID
        sync: false
      - key: CUADRE_FILES_KEY
        sync: false
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REFRESH_TOKEN
        sync: false
